name: Spike
description: A time-boxed investigation that ends in a finding, decision or follow-up stories
title: "[Spike] "
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time-box
      placeholder: "for example 4 hours"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected output
      description: A written finding, an ADR, a prototype to discard, or follow-up stories.
  - type: textarea
    id: context
    attributes:
      label: Context and links
