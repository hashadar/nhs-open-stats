[project]
name = "nhs-stats"
version = "0.1.0"
description = "Cleansed, documented, dashboard-ready tables from NHS England statistical work areas."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Hasha Dar" }]
dependencies = [
    "polars>=1.9",
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
nhs-stats = "nhs_stats.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhs_stats"]

[tool.hatch.build.targets.wheel.force-include]
"contracts" = "nhs_stats/_contracts"
"sql" = "nhs_stats/_sql"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# SQL is repo-controlled and paths are escaped literals.
"src/nhs_stats/gold.py" = ["S608"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
